# The Windows app (SPEC.md, module `win-shell`, scope 4; CONSTRAINTS.md, the C# rows):
# SticklerCore's tests on Linux, and on windows-2025 the whole solution built with warnings as
# errors, its format checked, the tests with the coverage gate, screenshots of the screens in
# light and dark, and the built app as an artifact for the owner.
name: win

on:
  push:
    branches: [main, "claude/win-*"]
    paths:
      - "win/**"
      - "docs/bridge.md"
      - "src/stickler_app/**"
      - "po/**"
      - "scripts/winstrings.py"
      - "scripts/cobertura_gate.py"
      - "scripts/win_screens.ps1"
      - "scripts/bridge_stand_ins.py"
      - "scripts/check_pdf.py"
      - "packaging/fonts/Leipzig.ttf"
      - ".github/workflows/win.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  UV_PYTHON: "3.14"

jobs:
  core-linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json # the owner's SDK: the same analyzers here and there
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: uv sync --locked
      - name: SticklerCore's tests with coverage
        run: >
          dotnet run --project win/SticklerCore.Tests -c Release --
          --coverage --coverage-output-format cobertura --coverage-output "$RUNNER_TEMP/core.cobertura.xml"
      - name: Coverage gate
        run: >
          uv run python scripts/cobertura_gate.py "$RUNNER_TEMP/core.cobertura.xml"
          --include "win/SticklerCore/*.cs" --exclude "/obj/*"

  app-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json # the owner's SDK: the same analyzers here and there
      - name: Tools
        run: |
          choco install ffmpeg --no-progress -y
          ffmpeg -version | head -n 1
          dotnet --info | head -n 12
      - run: uv sync --locked
      - name: Build (warnings are errors)
        run: dotnet build win/Stickler.sln -c Release
      - name: The app is where the screenshots and the artifact look
        run: test -f win/Stickler/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64/Stickler.exe
      - name: Format
        run: dotnet format win/Stickler.sln --verify-no-changes
      - name: SticklerCore's tests with coverage
        run: >
          dotnet run --project win/SticklerCore.Tests -c Release --no-build --
          --coverage --coverage-output-format cobertura --coverage-output "$RUNNER_TEMP/core.cobertura.xml"
      - name: Coverage gate
        run: >
          uv run python scripts/cobertura_gate.py "$RUNNER_TEMP/core.cobertura.xml"
          --include "win/SticklerCore/*.cs" --exclude "/obj/*"
      - name: Screenshots, light and dark
        shell: pwsh
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/win_screens.ps1
          -App "win/Stickler/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64/Stickler.exe"
          -Out "$env:RUNNER_TEMP/screens"
      - name: The PDF saved through Export (module win-sheet)
        run: uv run python scripts/check_pdf.py "$RUNNER_TEMP/screens/W6-sheet.pdf" --pages 1 --title Groove
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: win-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stickler-windows-app
          path: win/Stickler/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64
