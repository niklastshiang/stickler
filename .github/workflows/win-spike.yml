          "LONG_LOCAL_C=$local" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "### Run C (long path, LongPathsEnabled=0)`n`n- LongPathsEnabled now: $now (was $env:LONGPATHS_FOUND)`n- LOCALAPPDATA: ``$local`` ($($local.Length) characters; $how)`n- Inno ignores the LOCALAPPDATA variable, so the installer got ``/DIR=$app```n- installer exit code $($p.ExitCode); program folder present: $(Test-Path "$app\python\python.exe")`n" |
            Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          if ($p.ExitCode -ne 0) { throw "installer failed in run C" }

