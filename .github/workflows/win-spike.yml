      # ---------------------------------------------------------------- run C, a 50-character profile name
      - name: "Run C: LongPathsEnabled=0, a deep LOCALAPPDATA, install"
        id: longprep
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          Set-ItemProperty -Path $key -Name LongPathsEnabled -Value 0 -Type DWord
          $now = (Get-ItemProperty $key).LongPathsEnabled
          $local = "C:\Users\$env:LONG_NAME_C\AppData\Local"
          $how = 'C:\Users\<20 characters>\AppData\Local itself'
          try { New-Item -ItemType Directory -Force $local -ErrorAction Stop | Out-Null }
          catch {
            $local = "C:\spike\$('x' * ($env:LONG_NAME_C.Length - 5))\AppData\Local".Substring(0)
            New-Item -ItemType Directory -Force $local | Out-Null
            $how = 'an equally long path on C: (C:\Users was not writable)'
          }
          Write-Host "LOCALAPPDATA for run C: $local ($($local.Length) characters)"
          # earlier data goes
          Remove-Item -Recurse -Force (Join-Path $env:LOCALAPPDATA 'Stickler') -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Users\$env:LONG_NAME" -ErrorAction SilentlyContinue
          $app = Join-Path $local 'Programs\Stickler'
