# A .flatpak, an AppImage (SPEC.md, module `packaging`), the Mac image (module `mac-package`),
# a .deb and .rpm (module `linux-packages`) and the Windows installer (module `win-package`) for
# every release. A release tag (vN) attaches them
# to its release (made as a draft if it
# does not exist yet); a manual run only builds them, as artifacts to try.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the manifest builds the checked-out commit from the git history
          persist-credentials: false
      - name: A release tag matches the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\([0-9]*\)".*/\1/p' pyproject.toml)
          test "${GITHUB_REF_NAME#v}" = "$version" || {
            echo "tag $GITHUB_REF_NAME, but pyproject.toml says version $version" >&2; exit 1; }
      - name: flatpak-builder and the GNOME 51 runtime
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//51 org.gnome.Sdk//51
      - name: The runtime's Python is the one the app's models are pinned to
        run: |
          runtime=$(flatpak run --command=python3 org.gnome.Platform//51 -c \
            'import sys; print(f"{sys.version_info[0]}.{sys.version_info[1]}")')
          for pin in adapters/transcribers/adtof adapters/beats/beat_this adapters/separators/demucs; do
            test "$(cat "$pin/.python-version")" = "$runtime" || {
              echo "$pin wants Python $(cat "$pin/.python-version"), the runtime has $runtime" >&2
              exit 1; }
          done
      - name: Build Stickler.flatpak
        run: |
          # build exactly this run's commit, not whatever HEAD resolves to in the mirror
          sed -i "s|        branch: HEAD .*|        commit: $GITHUB_SHA|" packaging/flatpak/ng.tshia.Stickler.yml
          grep -q "commit: $GITHUB_SHA" packaging/flatpak/ng.tshia.Stickler.yml
          flatpak-builder --user --force-clean --repo=repo build packaging/flatpak/ng.tshia.Stickler.yml
          version=$(sed -n 's/^version = "\([0-9]*\)".*/\1/p' pyproject.toml)
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "Stickler-$version.flatpak" ng.tshia.Stickler
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak
          path: Stickler-*.flatpak
          if-no-files-found: error

  appimage:
    runs-on: ubuntu-26.04
    # the Anylinux AppImages project's Arch image, pinned (scripts/appimage.sh)
    container: ghcr.io/pkgforge-dev/archlinux@sha256:a96f110aad5150fedd880c05099edd42348e0caf8282ce8c19b92720ed265d5b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the AppImage
        run: sh scripts/appimage.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: dist/Stickler-*
          if-no-files-found: error

  # The .deb and .rpm, each installed, started and removed again in clean Ubuntu 26.04, Fedora
  # 44 and Fedora 45 containers before it is kept (SPEC.md, module `linux-packages`).
  linux-packages:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext podman
      - name: Build and test in the containers
        run: python3 scripts/linux_packages.py test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: |
            dist/Stickler-*.deb
            dist/Stickler-*.rpm
          if-no-files-found: error

  # The Mac app with its core, ad-hoc signed, in a plain image (SPEC.md, module `mac-package`,
  # scope 2 and 6; tried first in the spike, task 131).
  mac:
    runs-on: macos-26
    defaults:
      run:
        shell: bash # with pipefail: a failing script before `| tee` fails its step
    env:
      XCODEGEN: "2.46.0" # as in mac.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode 26.6 # as in mac.yml
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: ffmpeg and ffprobe, from source
        # built anew, as mac.yml's job does, not taken from its cache: what a release ships comes
        # from no cache another run could have written (zizmor: cache-poisoning)
        run: |
          start=$(date +%s)
          scripts/mac_ffmpeg.sh "$RUNNER_TEMP/ffmpeg"
          echo "### ffmpeg from source: $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"
          brew install ffmpeg >/dev/null # only to make the test clips
          scripts/mac_ffmpeg_test.sh "$RUNNER_TEMP/ffmpeg" "$(brew --prefix)/bin/ffmpeg"
      - name: The app
        run: |
          curl -fsSLO "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  xcodegen.zip" | shasum -a 256 -c
          unzip -q xcodegen.zip -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --spec mac/project.yml
          xcodebuild build -project mac/Stickler.xcodeproj -scheme Stickler \
            -configuration Release -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/release" -quiet
      - name: The core into the app
        run: |
          app="$RUNNER_TEMP/release/Build/Products/Release/Stickler.app"
          scripts/mac_bundle.sh "$app" "$RUNNER_TEMP/ffmpeg" | tee "$RUNNER_TEMP/bundle.log"
          {
            echo "### The app's parts"
            echo '```'
            sed -n '/^== sizes/,$p' "$RUNNER_TEMP/bundle.log" | tail -n +2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Each helper, then the app, signed ad hoc
        run: |
          app="$RUNNER_TEMP/release/Build/Products/Release/Stickler.app"
          core="$app/Contents/Resources/core"
          # inside out and without --deep (SPEC.md, module `mac-package`, scope 2): every Mach-O
          # file of the core (uv, ffmpeg, ffprobe, Python and the wheels' compiled parts) on its
          # own, then the app over its new resources
          signed=0
          while IFS= read -r -d '' file; do
            if file -b "$file" | grep -q '^Mach-O'; then
              codesign --force --sign - --timestamp=none "$file"
              codesign --verify --strict "$file" # each of them, not only the four helpers
              signed=$((signed + 1))
            fi
          done < <(find "$core" -type f \( -perm -100 -o -name '*.so' -o -name '*.dylib' \) -print0)
          test "$signed" -gt 3
          codesign --force --sign - --timestamp=none "$app"
          codesign --verify --strict --verbose=2 "$app"
          for helper in "$core"/bin/{uv,ffmpeg,ffprobe} "$(realpath "$core/python/bin/python3")"; do
            codesign --verify --strict --verbose=2 "$helper"
          done
          echo "### Signed ad hoc: $signed helpers, then the app" >> "$GITHUB_STEP_SUMMARY"
      - name: The image
        run: |
          app="$RUNNER_TEMP/release/Build/Products/Release/Stickler.app"
          version=$(sed -n 's/^version = "\([0-9]*\)".*/\1/p' pyproject.toml)
          test -n "$version"
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage" "$RUNNER_TEMP/image"
          ditto "$app" "$stage/Stickler.app"
          ln -s /Applications "$stage/Applications"
          dmg="$RUNNER_TEMP/image/Stickler-$version.dmg"
          hdiutil create -volname Stickler -srcfolder "$stage" -fs HFS+ -format UDZO -ov "$dmg"
          echo "### The image: Stickler-$version.dmg, $(du -h "$dmg" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: The app from the image starts its own core
        run: |
          dmg=$(echo "$RUNNER_TEMP"/image/Stickler-*.dmg)
          mnt="$RUNNER_TEMP/mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          test -L "$mnt/Applications" && test "$(readlink "$mnt/Applications")" = /Applications
          codesign --verify --strict "$mnt/Stickler.app"
          # as CoreClient.bundled starts it: nothing of the runner's on the PATH, a home of its
          # own; once straight from the read-only image (as a translocated app runs), once from
          # the app dragged out of it
          hello() { # core folder, home
            printf '%s\n' '{"id": 1, "cmd": "settings"}' '{"id": 2, "cmd": "quit"}' \
              | (cd "$1" && env -i HOME="$2" STICKLER_PACKAGED=macos LANGUAGE=de_DE:en \
                  PATH="$1/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
                  python/bin/python3 -I -B -m stickler_app.bridge) | tee "$RUNNER_TEMP/core.out"
            grep -q '"event": "hello"' "$RUNNER_TEMP/core.out"
            grep -q '"language": "de"' "$RUNNER_TEMP/core.out"
            grep -q '"id": 1, "ok": true' "$RUNNER_TEMP/core.out"
          }
          mkdir -p "$RUNNER_TEMP/home-image" "$RUNNER_TEMP/home"
          hello "$mnt/Stickler.app/Contents/Resources/core" "$RUNNER_TEMP/home-image"
          ditto "$mnt/Stickler.app" "$RUNNER_TEMP/installed/Stickler.app"
          hdiutil detach "$mnt"
          app="$RUNNER_TEMP/installed/Stickler.app"
          core="$app/Contents/Resources/core"
          codesign --verify --strict --verbose=2 "$app"
          for helper in "$core"/bin/{uv,ffmpeg,ffprobe} "$(realpath "$core/python/bin/python3")"; do
            test -x "$helper" # the image keeps the executable bits
            codesign --verify --strict "$helper"
          done
          "$core/bin/uv" --version
          hello "$core" "$RUNNER_TEMP/home"
          # numpy and Verovio work, without models: a bar of notes becomes one engraved page
          (cd "$core" && env -i HOME="$RUNNER_TEMP/home" PATH="/usr/bin:/bin" python/bin/python3 -I -B -c '
          from stickler import notation
          from stickler_app import engraving
          beats = [k * 0.5 for k in range(9)]
          xml = notation.to_musicxml([(t, 36, 100) for t in beats[:8]], beats, beats[:-1:4])
          pages = engraving.engrave(xml, width=800)
          assert len(pages) == 1 and "<svg" in pages[0].svg and pages[0].bars, pages
          print("engraved", len(pages[0].svg), "bytes,", len(pages[0].bars), "bars")
          ')
          test -f "$core/licenses/README.txt"
          # nothing was written into the app
          codesign --verify --strict "$app"
          test -z "$(find "$core" -name __pycache__ -print -quit)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac
          path: ${{ runner.temp }}/image/Stickler-*.dmg
          if-no-files-found: error
          compression-level: 0 # the image is compressed already

  windows:
    # the installer for Windows 11 (SPEC.md, module `win-package`): the app, its core and the
    # uninstaller's question, then installed, started and removed on the runner
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      MSYS_NO_PATHCONV: "1" # Git's bash must not turn /VERYSILENT into a path
      INNO_VERSION: "7.1.1" # 2026-10-28, the recommended version; the runner has 6.7.1
      INNO_SHA256: 8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0
    steps:
      - name: Files as they are in the repository (no CRLF on checkout)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Inno Setup, pinned
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/inno.exe" \
            "https://github.com/jrsoftware/issrc/releases/download/is-${INNO_VERSION//./_}/innosetup-$INNO_VERSION-x64.exe"
          echo "$INNO_SHA256  $RUNNER_TEMP/inno.exe" | sha256sum -c -
          # for all users, where the runner's administrator puts it (with /CURRENTUSER and
          # /DIR its setup stopped with exit code 4, run 45795484590)
          log=$(cygpath -w "$RUNNER_TEMP/inno-setup.log")
          if ! "$RUNNER_TEMP/inno.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- "/LOG=$log"; then
            tail -n 40 "$RUNNER_TEMP/inno-setup.log"; exit 1
          fi
          iscc=""
          for candidate in "/c/Program Files/Inno Setup 7/ISCC.exe" "/c/Program Files (x86)/Inno Setup 7/ISCC.exe"; do
            if [ -f "$candidate" ]; then iscc=$candidate; break; fi
          done
          test -n "$iscc" || { tail -n 40 "$RUNNER_TEMP/inno-setup.log"; exit 1; }
          echo "ISCC=$iscc" >> "$GITHUB_ENV"
          echo "ISCC: $iscc"
      - name: The installed folder
        run: |
          scripts/win_bundle.sh "$RUNNER_TEMP/layout" | tee "$RUNNER_TEMP/bundle.log"
          {
            echo "### The installed folder's parts"
            echo '```'
            sed -n '/^== sizes/,$p' "$RUNNER_TEMP/bundle.log" | tail -n +2
            echo '```'
            echo "Longest path below the install folder: $(cd "$RUNNER_TEMP/layout" && find . | awk '{ print length($0) - 2 }' | sort -n | tail -n 1) characters"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The installer
        run: |
          version=$(sed -n 's/^version = "\([0-9]*\)".*/\1/p' pyproject.toml)
          test -n "$version"
          "$ISCC" "/DLayout=$(cygpath -w "$RUNNER_TEMP/layout")" \
            "/DAppVersion=$version" "/DOutDir=$(cygpath -w "$RUNNER_TEMP/installer")" \
            win/installer/Stickler.iss
          setup="$RUNNER_TEMP/installer/Stickler-$version-setup.exe"
          echo "### The installer: $(basename "$setup"), $(du -h "$setup" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Installed, started and removed on the runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(\d+)"').Matches[0].Groups[1].Value
          $setup = Join-Path $env:RUNNER_TEMP "installer\Stickler-$version-setup.exe"
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Stickler'
          $data = Join-Path $env:LOCALAPPDATA 'Stickler'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{1307FF50-F481-4FF5-90FB-892B9A297AC6}_is1'
          $menu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Stickler.lnk'
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Stickler.lnk'
          function Check($what, $ok) { if (-not $ok) { throw "failed: $what" }; Write-Host "ok  $what" }

          # per user, without a question (silently, as a test can)
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\install.log" -Wait -PassThru
          Check "the installer's exit code 0 ($($p.ExitCode))" ($p.ExitCode -eq 0)
          foreach ($part in 'Stickler.exe', 'Stickler.ico', 'unins000.exe', 'core\bin\uv.exe', 'core\bin\ffmpeg.exe',
                   'core\bin\ffprobe.exe', 'core\python\python.exe', 'core\licenses\README.txt',
                   'core\python\share\stickler\adapters\transcribers\adtof\run.py') {
            Check "installed: $part" (Test-Path (Join-Path $app $part))
          }
          Check 'the Start menu entry' (Test-Path $menu)
          Check 'the desktop icon' (Test-Path $desktop)
          $entry = Get-ItemProperty $key
          Check "Settings > Apps: $($entry.DisplayName), $($entry.DisplayVersion), $($entry.Publisher)" (
            $entry.DisplayName -eq 'Stickler' -and $entry.DisplayVersion -eq $version -and $entry.Publisher -eq 'Stickler')
          Check "its icon: $($entry.DisplayIcon)" ($entry.DisplayIcon -like '*Programs\Stickler\Stickler.exe')

          # the installed core, as the app starts it, with the network refused: hello, then a
          # bar of notes engraved (numpy and Verovio work without models)
          $core = Join-Path $app 'core'
          $env:STICKLER_PACKAGED = 'windows'; $env:LANGUAGE = 'de_DE:en'; $env:PYTHONUTF8 = '1'
          $env:UV_OFFLINE = '1'; $env:HF_HUB_OFFLINE = '1'; $env:HTTPS_PROXY = 'http://127.0.0.1:9'; $env:HTTP_PROXY = 'http://127.0.0.1:9'
          $saved = $env:PATH
          $env:PATH = "$core\bin;$env:SystemRoot\System32;$env:SystemRoot"
          $out = '{"id": 1, "cmd": "settings"}', '{"id": 2, "cmd": "quit"}' | & "$core\python\python.exe" -I -B -m stickler_app.bridge
          $out | Write-Host
          Check 'the core says hello in German' (($out -match '"event": "hello"') -and ($out -match '"language": "de"'))
          Check 'the core answers' ($out -match '"id": 1, "ok": true')
          & "$core\python\python.exe" -I -B -c @'
          from stickler import notation
          from stickler_app import engraving
          beats = [k * 0.5 for k in range(9)]
          xml = notation.to_musicxml([(t, 36, 100) for t in beats[:8]], beats, beats[:-1:4])
          pages = engraving.engrave(xml, width=800)
          assert len(pages) == 1 and "<svg" in pages[0].svg and pages[0].bars, pages
          print("engraved", len(pages[0].svg), "bytes,", len(pages[0].bars), "bars")
          '@
          Check 'the installed core engraves' ($LASTEXITCODE -eq 0)
          & "$core\bin\uv.exe" --version
          & "$core\bin\ffprobe.exe" -version | Select-Object -First 1
          $env:PATH = $saved

          # the app starts its own core and shows its window (the consent: no models here)
          $run = Start-Process (Join-Path $app 'Stickler.exe') -PassThru
          Start-Sleep -Seconds 20
          Check 'the app still runs after 20 s' (-not $run.HasExited)
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\screens" | Out-Null
          $bitmap.Save("$env:RUNNER_TEMP\screens\installed-app.png")
          $children = Get-CimInstance Win32_Process -Filter "ParentProcessId = $($run.Id)" | Select-Object -ExpandProperty Name
          Check "the app started its core: $($children -join ', ')" ($children -contains 'python.exe')
          $run.CloseMainWindow() | Out-Null
          if (-not $run.WaitForExit(15000)) { Stop-Process -Id $run.Id -Force }

          # the uninstaller's removal of the data (as with the box ticked), then a silent
          # uninstall: the program, its entries and WebView2's folder go, kept data stays
          New-Item -ItemType Directory -Force "$data\data\adapters\x", "$data\cache\results", "$data\config", "$data\WebView2\x" | Out-Null
          Set-Content "$data\config\settings.json" '{}'
          & "$core\python\python.exe" -I -m stickler_app.uninstall --everything
          Check 'the core removed its folders' (($LASTEXITCODE -eq 0) -and -not (Test-Path "$data\data") -and -not (Test-Path "$data\config") -and -not (Test-Path "$data\cache"))
          New-Item -ItemType Directory -Force "$data\config" | Out-Null
          Set-Content "$data\config\settings.json" '{}'
          $p = Start-Process (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\uninstall.log" -Wait -PassThru
          Check "the uninstaller's exit code 0 ($($p.ExitCode))" ($p.ExitCode -eq 0)
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 1 } # it finishes from a copy in TEMP
          Check 'the program folder is gone' (-not (Test-Path $app))
          Check 'the Settings > Apps entry is gone' (-not (Test-Path $key))
          Check 'the Start menu entry and the desktop icon are gone' (-not (Test-Path $menu) -and -not (Test-Path $desktop))
          Check "WebView2's folder is gone" (-not (Test-Path "$data\WebView2"))
          Check 'a silent uninstall keeps the settings' (Test-Path "$data\config\settings.json")
      - name: The logs
        if: always()
        run: |
          for log in install uninstall; do
            echo "== $log"; cat "$RUNNER_TEMP/$log.log" 2>/dev/null | tail -n 40 || true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: ${{ runner.temp }}/installer/Stickler-*-setup.exe
          if-no-files-found: error
          compression-level: 0 # the installer is compressed already
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-screens
          path: ${{ runner.temp }}/screens/
          if-no-files-found: ignore

  windows-10-refused:
    # Windows Server 2022 is build 20348, below Windows 11's 22000: the installer must stop
    # there with Stickler's message and install nothing (SPEC.md, module `win-package`)
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 10
    continue-on-error: true # the image may be retired; the check is not the release's
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: installer
      - name: The installer refuses
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer\Stickler-*-setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\refused.log" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\refused.log" -ErrorAction SilentlyContinue | Select-Object -Last 15
          if ($p.ExitCode -eq 0) { throw 'installed on build 20348' }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\Stickler')) { throw 'wrote the program folder' }
          "### Refused below Windows 11 (exit code $($p.ExitCode))" >> $env:GITHUB_STEP_SUMMARY

  attach:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [flatpak, appimage, mac, linux-packages, windows]
    runs-on: ubuntu-26.04
    permissions:
      contents: write # upload to the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: files
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Release ${TAG#v}" --notes "Release notes follow."
          fi
          rm -f files/*.png # the Windows job's screenshot is for the run, not the release
          gh release upload "$TAG" files/* --repo "$GITHUB_REPOSITORY" --clobber
