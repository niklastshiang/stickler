# The website (SPEC.md "Website"). Every change to it is checked (the site's tests, axe-core on
# every page in light and dark) and built into a Pages artifact whose download cards name the
# newest release's files. It is published only by hand (deploy: true) or by a published release
# from 8 on, the release that brings the Mac app.
name: site

on:
  push:
    paths:
      - "site/**"
      - "scripts/site_*.py"
      - "tests/test_site*.py"
      - ".github/workflows/site.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the site to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

env:
  PLAYWRIGHT: "1.65.2"
  AXE: "4.14.1"
  # npm's integrity string for axe-core 4.14.1 (registry.npmjs.org, checked 2026-11-18)
  AXE_INTEGRITY: "sha512-FHfa+lmNjQZfJz1q8wKqIDwC6DExcHt/pkjNQb09a3NPjCKg2rhu5qb2S4r76ASyFNNtuFooJpZe37OgudVGtQ=="

jobs:
  build:
    runs-on: ubuntu-26.04
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: The site's tests
        run: uv run pytest -q tests/test_site.py tests/test_site_release.py
      - name: The download cards name the release's files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release view ${TAG:+"$TAG"} --repo "$GITHUB_REPOSITORY" --json tagName,assets \
            > "$RUNNER_TEMP/release.json"
          uv run python scripts/site_release.py "$RUNNER_TEMP/release.json" site _site
      - name: axe-core finds no WCAG 2.2 A/AA violation, light and dark
        run: |
          curl -sSfLo "$RUNNER_TEMP/axe.tgz" "https://registry.npmjs.org/axe-core/-/axe-core-$AXE.tgz"
          test "sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/axe.tgz" | base64 -w0)" = "$AXE_INTEGRITY"
          tar -xzf "$RUNNER_TEMP/axe.tgz" -C "$RUNNER_TEMP" package/axe.min.js
          uvx --from "playwright==$PLAYWRIGHT" playwright install --with-deps chromium
          uvx --with "playwright==$PLAYWRIGHT" python -I scripts/site_axe.py _site \
            "$RUNNER_TEMP/package/axe.min.js"
      - name: Published only by hand or by release 8 and later
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          WANTED: ${{ inputs.deploy }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          deploy=false
          if [ "$EVENT" = workflow_dispatch ] && [ "$WANTED" = true ]; then deploy=true; fi
          if [ "$EVENT" = release ] && [ "${TAG#v}" -ge 8 ] 2>/dev/null; then deploy=true; fi
          # a page still holding a placeholder (the author's words) is never published
          if [ "$deploy" = true ] && grep -rnE '\[(The owner|Eigene Worte)' _site; then
            echo "placeholders left in the site" >&2; exit 1
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
