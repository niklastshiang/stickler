# The Mac app's Swift (SPEC.md, module `mac-shell`; CONSTRAINTS.md "Swift lint", "Swift tests",
# "Swift coverage"). No one here has Xcode: these jobs are the only compiler for the app, and
# SticklerCore is checked on Linux too, where it is also developed.
name: mac

on:
  push:
    branches: [main, "claude/mac-shell"] # the app compiles only here: each task is checked on the branch before main
  pull_request:

permissions:
  contents: read

env:
  SWIFTLINT: "0.65.1" # newest release on 2026-11-18; the SHA-256 below are GitHub's digests

jobs:
  core-linux:
    runs-on: ubuntu-26.04 # Swift 6.4.2 preinstalled (runner image of 2026-11-11)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: The core, for the client's tests against the real bridge
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          uv sync --locked
      - name: SwiftLint
        run: |
          curl -fsSLO "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT/swiftlint_linux_amd64.zip"
          echo "caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d  swiftlint_linux_amd64.zip" | sha256sum -c
          unzip -q swiftlint_linux_amd64.zip swiftlint-static -d "$RUNNER_TEMP/swiftlint"
          "$RUNNER_TEMP/swiftlint/swiftlint-static" lint --strict
      - name: Tests with coverage
        working-directory: mac/SticklerCore
        run: |
          swift --version
          swift test --enable-code-coverage
          python3 ../../scripts/swift_coverage.py "$(swift test --show-codecov-path)" .

  core-macos:
    runs-on: macos-26 # the app's deployment target; arm64, free for a public repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: The core, for the client's tests against the real bridge
        run: |
          brew install ffmpeg
          uv sync --locked
      - name: Xcode 26.6 # the image's default on 2026-11-18, pinned so an image update is seen
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: SwiftLint
        run: |
          curl -fsSLO "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT/portable_swiftlint.zip"
          echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  portable_swiftlint.zip" | shasum -a 256 -c
          unzip -q portable_swiftlint.zip swiftlint -d "$RUNNER_TEMP/swiftlint"
          "$RUNNER_TEMP/swiftlint/swiftlint" lint --strict
      - name: Tests with coverage
        working-directory: mac/SticklerCore
        run: |
          swift --version
          swift test --enable-code-coverage
          python3 ../../scripts/swift_coverage.py "$(swift test --show-codecov-path)" .

  # ffmpeg and ffprobe for the packaged app (SPEC.md, module `mac-package`, decision 2): built
  # from the pinned source and tried on a clip of every format, once per version of the build
  # script; the cache then holds a build that passed. release.yml builds its own, from no cache.
  ffmpeg:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: built
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: mac-ffmpeg-${{ hashFiles('scripts/mac_ffmpeg.sh', 'scripts/mac_ffmpeg_test.sh') }}
      - name: Build and try it
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          start=$(date +%s)
          scripts/mac_ffmpeg.sh "$RUNNER_TEMP/ffmpeg"
          echo "ffmpeg from source: $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"
          brew install ffmpeg >/dev/null # only to make the test clips
          scripts/mac_ffmpeg_test.sh "$RUNNER_TEMP/ffmpeg" "$(brew --prefix)/bin/ffmpeg"
      - name: Sizes
        run: du -h "$RUNNER_TEMP/ffmpeg"/* | tee -a "$GITHUB_STEP_SUMMARY"

  # The app itself (SPEC.md, module `mac-shell`, scope 4): generated, built and tested here, its
  # screens kept as pictures. The app to try on a Mac is the image of release.yml (run by hand):
  # a bare build here has no core and does not start (module `mac-package`).
  app:
    runs-on: macos-26
    env:
      XCODEGEN: "2.46.0" # 2026-07-16; its SHA-256 is GitHub's digest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: The project, from mac/project.yml
        run: |
          curl -fsSLO "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  xcodegen.zip" | shasum -a 256 -c
          unzip -q xcodegen.zip -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --spec mac/project.yml
      - name: Build and test
        env:
          TEST_RUNNER_STICKLER_SCREENSHOTS: ${{ runner.temp }}/screenshots
        run: |
          xcodebuild test -project mac/Stickler.xcodeproj -scheme Stickler \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath "$RUNNER_TEMP/test" \
            -resultBundlePath "$RUNNER_TEMP/test.xcresult" -quiet
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/test.xcresult" \
            | python3 -c 'import json, sys; r = json.load(sys.stdin); print(r["result"], r["passedTests"], "passed,", r["failedTests"], "failed,", r["skippedTests"], "skipped")'
      - name: The app's logic outside views is covered (CONSTRAINTS.md "Swift coverage")
        run: |
          xcrun xccov view --report --json "$RUNNER_TEMP/test.xcresult" > "$RUNNER_TEMP/coverage.json"
          python3 scripts/xccov_gate.py "$RUNNER_TEMP/coverage.json"
      - name: The Release build compiles, ad-hoc signed
        run: |
          xcodebuild build -project mac/Stickler.xcodeproj -scheme Stickler \
            -configuration Release -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/release" -quiet
          codesign --verify --verbose "$RUNNER_TEMP/release/Build/Products/Release/Stickler.app"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: error
