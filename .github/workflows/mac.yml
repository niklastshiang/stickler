# The Mac app's Swift (SPEC.md, module `mac-shell`; CONSTRAINTS.md "Swift lint", "Swift tests",
# "Swift coverage"). No one here has Xcode: these jobs are the only compiler for the app, and
# SticklerCore is checked on Linux too, where it is also developed.
name: mac

on:
  push:
    branches: [main, "claude/mac-shell"] # the app compiles only here: each task is checked on the branch before main
  pull_request:

permissions:
  contents: read

env:
  SWIFTLINT: "0.65.1" # newest release on 2026-11-18; the SHA-256 below are GitHub's digests

jobs:
  core-linux:
    runs-on: ubuntu-26.04 # Swift 6.4.2 preinstalled (runner image of 2026-11-11)
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - name: The core, for the client's tests against the real bridge
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          uv sync --locked
      - name: SwiftLint
        run: |
          curl -fsSLO "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT/swiftlint_linux_amd64.zip"
          echo "caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d  swiftlint_linux_amd64.zip" | sha256sum -c
          unzip -q swiftlint_linux_amd64.zip swiftlint-static -d "$RUNNER_TEMP/swiftlint"
          "$RUNNER_TEMP/swiftlint/swiftlint-static" lint --strict
      - name: Tests with coverage
        working-directory: mac/SticklerCore
        run: |
          swift --version
          swift test --enable-code-coverage
          python3 ../../scripts/swift_coverage.py "$(swift test --show-codecov-path)" .

  core-macos:
    runs-on: macos-26 # the app's deployment target; arm64, free for a public repository
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - name: The core, for the client's tests against the real bridge
        run: |
          brew install ffmpeg
          uv sync --locked
      - name: Xcode 26.6 # the image's default on 2026-11-18, pinned so an image update is seen
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: SwiftLint
        run: |
          curl -fsSLO "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT/portable_swiftlint.zip"
          echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  portable_swiftlint.zip" | shasum -a 256 -c
          unzip -q portable_swiftlint.zip swiftlint -d "$RUNNER_TEMP/swiftlint"
          "$RUNNER_TEMP/swiftlint/swiftlint" lint --strict
      - name: Tests with coverage
        working-directory: mac/SticklerCore
        run: |
          swift --version
          swift test --enable-code-coverage
          python3 ../../scripts/swift_coverage.py "$(swift test --show-codecov-path)" .

  # The app itself (SPEC.md, module `mac-shell`, scope 4): generated, built and tested here, its
  # screens kept as pictures and the app as a download for the owner's Mac.
  app:
    runs-on: macos-26
    env:
      XCODEGEN: "2.46.0" # 2026-07-16; its SHA-256 is GitHub's digest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: The project, from mac/project.yml
        run: |
          curl -fsSLO "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  xcodegen.zip" | shasum -a 256 -c
          unzip -q xcodegen.zip -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --spec mac/project.yml
      - name: Build and test
        env:
          TEST_RUNNER_STICKLER_SCREENSHOTS: ${{ runner.temp }}/screenshots
        run: |
          xcodebuild test -project mac/Stickler.xcodeproj -scheme Stickler \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/test" -quiet
      - name: The app, ad-hoc signed
        run: |
          xcodebuild build -project mac/Stickler.xcodeproj -scheme Stickler \
            -configuration Release -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/release" -quiet
          app="$RUNNER_TEMP/release/Build/Products/Release/Stickler.app"
          codesign --verify --verbose "$app"
          # ditto keeps the executable bit and the signature; upload-artifact's own zip would not
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Stickler.zip"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ runner.temp }}/Stickler.zip
          archive: false
