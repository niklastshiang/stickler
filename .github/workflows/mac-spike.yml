# The packaging spike (SPEC.md, module `mac-package`, scope 1; task 131): one ad-hoc signed
# Stickler.app that brings its core along, in a plain .dmg, for the owner's Mac. Run by hand
# only; removed again when the release workflow builds the image (task 136).
name: mac-spike

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: macos-26
    env:
      XCODEGEN: "2.46.0" # as in mac.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: ffmpeg and ffprobe, from source
        run: |
          start=$(date +%s)
          scripts/mac_ffmpeg.sh "$RUNNER_TEMP/ffmpeg"
          {
            echo "### ffmpeg from source"
            echo "- build: $(( $(date +%s) - start )) s"
            echo "- ffmpeg: $(du -h "$RUNNER_TEMP/ffmpeg/ffmpeg" | cut -f1), ffprobe: $(du -h "$RUNNER_TEMP/ffmpeg/ffprobe" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The app
        run: |
          curl -fsSLO "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  xcodegen.zip" | shasum -a 256 -c
          unzip -q xcodegen.zip -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --spec mac/project.yml
          xcodebuild build -project mac/Stickler.xcodeproj -scheme Stickler \
            -configuration Release -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/release" -quiet
      - name: The core into the app
        run: |
          app="$RUNNER_TEMP/release/Build/Products/Release/Stickler.app"
          scripts/mac_bundle.sh "$app" "$RUNNER_TEMP/ffmpeg" | tee "$RUNNER_TEMP/bundle.log"
          {
            echo "### The app's parts"
            echo '```'
            sed -n '/^== sizes/,$p' "$RUNNER_TEMP/bundle.log" | tail -n +2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The image
        run: |
          app="$RUNNER_TEMP/release/Build/Products/Release/Stickler.app"
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          ditto "$app" "$stage/Stickler.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname Stickler -srcfolder "$stage" -fs HFS+ -format UDZO -ov \
            "$RUNNER_TEMP/Stickler-spike.dmg"
          echo "### The image: $(du -h "$RUNNER_TEMP/Stickler-spike.dmg" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: The app from the image starts its own core
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mnt" "$RUNNER_TEMP/Stickler-spike.dmg"
          ditto "$RUNNER_TEMP/mnt/Stickler.app" "$RUNNER_TEMP/installed/Stickler.app"
          hdiutil detach "$RUNNER_TEMP/mnt"
          app="$RUNNER_TEMP/installed/Stickler.app"
          core="$app/Contents/Resources/core"
          codesign --verify --strict --verbose=2 "$app"
          test -x "$core/bin/uv" && test -x "$core/bin/ffmpeg" && test -x "$core/bin/ffprobe"
          "$core/bin/uv" --version
          # as CoreClient.bundled starts it: nothing of the runner's on the PATH, a home of its own
          home="$RUNNER_TEMP/home"
          mkdir -p "$home"
          printf '%s\n' '{"id": 1, "cmd": "settings"}' '{"id": 2, "cmd": "quit"}' \
            | (cd "$core" && env -i HOME="$home" STICKLER_PACKAGED=macos LANGUAGE=de_DE:en \
                PATH="$core/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
                python/bin/python3 -I -B -m stickler_app.bridge) | tee "$RUNNER_TEMP/core.out"
          grep -q '"event": "hello"' "$RUNNER_TEMP/core.out"
          grep -q '"language": "de"' "$RUNNER_TEMP/core.out"
          grep -q '"id": 1, "ok": true' "$RUNNER_TEMP/core.out"
          # nothing was written into the app
          codesign --verify --strict "$app"
          test -z "$(find "$core" -name __pycache__ -print -quit)"
      - name: The built ffmpeg reads what a drummer has
        run: |
          brew install ffmpeg >/dev/null # only to make the test clips
          core="$RUNNER_TEMP/installed/Stickler.app/Contents/Resources/core"
          clips="$RUNNER_TEMP/clips"
          mkdir -p "$clips"
          for kind in mp3 flac wav ogg opus aiff m4a; do
            ffmpeg -v error -f lavfi -i "sine=frequency=440:duration=2" "$clips/clip.$kind"
          done
          export PATH="$core/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          test "$(command -v ffmpeg)" = "$core/bin/ffmpeg"
          for clip in "$clips"/clip.*; do
            ffmpeg -v error -y -i "$clip" -map 0:a:0 -c:a flac "$clip.flac"
            ffmpeg -v error -i "$clip" -ar 22050 -f f32le - | wc -c
            seconds=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$clip.flac")
            echo "$(basename "$clip"): $seconds s"
            case "$seconds" in 1.9*|2.0*) ;; *) echo "wrong length" >&2; exit 1 ;; esac
          done
          ffprobe -v error -show_entries format_tags -of json "$clips/clip.mp3" >/dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Stickler-spike
          path: ${{ runner.temp }}/Stickler-spike.dmg
          compression-level: 0
