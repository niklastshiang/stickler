# The checks from CONSTRAINTS.md on every push to main and every pull request (and on the
# branches of the Windows work, whose only Windows is the runner here).
name: check

on:
  push:
    branches: [main, "claude/win-*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.15"] # the ends of the harness's range (pyproject.toml)
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the floor guard compares against the previous state
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg gettext # msgfmt: the packages stage .mo files
          git config --global user.name "CI"
          git config --global user.email "ci@users.noreply.github.com"
      - run: uv sync --locked
      - name: Lint, format, floor guard, tests with coverage
        run: scripts/check.sh task
      - name: Floor guard over everything this push or pull request adds
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            uv run python scripts/floor_guard.py --base "$BASE"
          fi

  # The Mac app's core (SPEC.md, module `mac-core`): the same checks on Apple Silicon. The GTK
  # tests stay on Linux (pytest's default selection leaves them out, as above).
  macos:
    # macos-15 (arm64, free for a public repository) while GitHub could not assign a macos-26
    # runner (2026-11-17: twice not acquired in 15 minutes); back to macos-26 once it can. The
    # Python core is the same on both; the app itself targets macOS 26 (checked on the owner's Mac).
    runs-on: macos-15
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the floor guard and a cache-key test read earlier commits
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Tools
        run: |
          brew install ffmpeg
          git config --global user.name "CI"
          git config --global user.email "ci@users.noreply.github.com"
      - run: uv sync --locked
      - name: Lint, format, floor guard, tests with coverage
        run: scripts/check.sh task

  # The Windows app's core (SPEC.md, module `win-core`): the same checks on Windows x64.
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash # scripts/check.sh; the runner's Git for Windows brings it
    env:
      UV_PYTHON: "3.14"
    steps:
      - name: Files as they are in the repository (no CRLF on checkout)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the floor guard and a cache-key test read earlier commits
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Tools
        run: |
          choco install ffmpeg --no-progress -y
          ffmpeg -version | head -n 1
          git config --global user.name "CI"
          git config --global user.email "ci@users.noreply.github.com"
      - run: uv sync --locked
      - name: Lint, format, floor guard, tests with coverage
        run: scripts/check.sh task

  metadata:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Desktop file and AppStream MetaInfo (what GNOME Software shows)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq appstream desktop-file-utils
          desktop-file-validate packaging/ng.tshia.Stickler.desktop
          appstreamcli validate --no-net --explain packaging/ng.tshia.Stickler.metainfo.xml

  secrets:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # scan the whole history
      - name: gitleaks (whole history, values redacted)
        env:
          VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v$VERSION"
          curl -sSfLO "$base/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_${VERSION}_checksums.txt" | grep linux_x64.tar.gz | sha256sum -c -
          tar xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git . --redact --no-banner
