# The checks from CONSTRAINTS.md on every push to main and every pull request.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the floor guard compares against the previous state
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          git config --global user.name "CI"
          git config --global user.email "ci@users.noreply.github.com"
      - run: uv sync --locked
      - name: Lint, format, floor guard, tests with coverage
        run: scripts/check.sh task
      - name: Floor guard over everything this push or pull request adds
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            uv run python scripts/floor_guard.py --base "$BASE"
          fi

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # scan the whole history
      - name: gitleaks (whole history, values redacted)
        env:
          VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v$VERSION"
          curl -sSfLO "$base/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_${VERSION}_checksums.txt" | grep linux_x64.tar.gz | sha256sum -c -
          tar xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git . --redact --no-banner
