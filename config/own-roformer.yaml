# Own songs with the RoFormer separator, computed on a rented GPU (`stickler remote`).
# Complements config/own.yaml (mix and Demucs) for the "Quality" mode decision.
datasets: [own]
separators: [roformer]
transcribers: [adt_str, adtof, muscriptor_m, yourmt3]
device: auto
schemes: ["5", "3"]
timeout:
  separators: 1800
  transcribers: {factor: 10, min: 120}  # 10 x song length, at least 120 s
