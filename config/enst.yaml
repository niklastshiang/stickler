# Benchmark on ENST-Drums (`stickler run --config config/enst.yaml`, results in results/enst/).
# The 64 minus-one tracks mixed with their accompaniment (stickler.datasets.enst), from Zenodo
# under CC BY-NC-ND 4.0 (research only). `oracle` = the wet drum mix.
# YourMT3+ (removed 2026-11-13) was trained on ENST-Drums (its paper, Table 1), so its numbers
# here were not a fair test; they stay in docs/report.md. ADT_STR reports state-of-the-art results on ENST.
datasets: [enst]
separators: [none, oracle, demucs, roformer]
transcribers: [adt_str, adtof, muscriptor_m, muscriptor_l, drumsep_onset, sad]
skip: ["none+muscriptor_m", "none+muscriptor_l", "roformer+muscriptor_l", "roformer+drumsep_onset", "roformer+sad", "oracle+sad", "demucs+sad"]  # release 7 candidates: Demucs (and oracle) only; sad closed on MDB (SPEC Release 7, method 3)
device: auto
schemes: ["5", "3"]
timeout:
  separators: 1800
  transcribers: {factor: 10, min: 120}  # 10 x song length, at least 120 s

# Same combos as config/own.yaml (chosen on the own songs), scored here as a check.
combos:
  quality:
    demucs+muscriptor_m: [KD, SD, TT]
    none+adtof: [HH, CY]
  quality_cy:                    # as quality, cymbals with the higher threshold
    demucs+muscriptor_m: [KD, SD, TT]
    fusion+adtof_cy: [HH, CY]
  toms:
    none+adtof: [KD, SD, HH, CY]
    demucs+muscriptor_m: [TT]

# Also scored after snapping to the beat grid like the sheet music (stickler.grid).
grid: [none+adtof, demucs+muscriptor_m, combo+quality]

# ADTOF with a higher cymbal threshold (0.44 instead of 0.30): chosen identically in all five
# folds of a cross-validation on the 25 own songs (2026-11-13), cymbal F1 on unseen songs
# 0.680 -> 0.710; the other classes stay at ADTOF's defaults (tuning them gave nothing).
fusions:
  # drumsep_onset with thresholds tuned on MDB and ENST, Demucs stem (stickler tune,
  # 2026-11-17; 87 tracks; the own songs were not used): SPEC Release 7, method 2
  drumsep_tuned:
    inputs: [demucs]
    transcriber: drumsep_onset
    classes:
      KD: {weights: [1.0], threshold: 0.08}
      SD: {weights: [1.0], threshold: 0.08}
      TT: {weights: [1.0], threshold: 0.26}
      HH: {weights: [1.0], threshold: 0.18}
      CY: {weights: [1.0], threshold: 0.16}
  adtof_cy:
    inputs: [none]
    classes:
      KD: {weights: [1.0], threshold: 0.22}
      SD: {weights: [1.0], threshold: 0.24}
      TT: {weights: [1.0], threshold: 0.32}
      HH: {weights: [1.0], threshold: 0.22}
      CY: {weights: [1.0], threshold: 0.44}
