# GM drum pitches → instrument classes.
# Pitches that appear in no scheme (e.g. cowbell 56, tambourine 54) are ignored.
# Ride counts as CY, as with ADTOF and customary in the ADT literature.
schemes:
  "5":
    KD: [35, 36]                      # Bass Drum
    SD: [37, 38, 40]                  # Side Stick, Snare, Electric Snare
    TT: [41, 43, 45, 47, 48, 50]      # Toms
    HH: [42, 44, 46]                  # Hi-hat closed, pedal, open
    CY: [49, 51, 52, 53, 55, 57, 59]  # Crash, Ride, China, Ride Bell, Splash
  "3":
    KD: [35, 36]
    SD: [37, 38, 40]
    HH: [42, 44, 46]
