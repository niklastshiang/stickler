# Welche Kombinationen `stickler run` / `stickler eval` rechnen.
# Separatoren: none (Original-Mix), oracle (isolierter Drum-Stem des Datensatzes, Obergrenze)
#              oder ein Adapter aus adapters/separators/
# Transkriber: Adapter aus adapters/transcribers/. Wer nur Drum-Stems verträgt
#              ([tool.stickler] input = "stem"), wird nicht mit `none` kombiniert.
datasets: [mdb]
separators: [none, oracle, demucs, roformer]
transcribers: [adt_str, adtof]
device: auto          # auto | cpu | gpu
schemes: ["5", "3"]   # aus config/classes.yaml
# Zeitlimit je Adapter-Aufruf in Sekunden (Überschreitung = Fehler "Zeitlimit").
# Transkriber 5 min: ADT_STR dekodiert auf Jazz-Drums bis zu 28 min für 103 s Audio.
# Separatoren 30 min: RoFormer braucht auf der CPU ~7× Echtzeit.
timeout:
  separators: 1800
  transcribers: 300
