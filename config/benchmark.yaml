# Which combinations `stickler run` / `stickler eval` compute.
# Separators: none (original mix), oracle (the dataset's isolated drum stem, upper bound)
#             or an adapter from adapters/separators/
# Transcribers: adapters from adapters/transcribers/. Those that only accept drum stems
#               ([tool.stickler] input = "stem") are not combined with `none`.
datasets: [mdb]
separators: [none, oracle, demucs, roformer]
transcribers: [adt_str, adtof, muscriptor_m]
# Dropped on 2026-11-12 (owner's decision, cached results are kept): MuScriptor small was last
# in every measurement (MDB Punk, first 7 MDB songs: macro-F1 0.51-0.58, first own song 0.47);
# MuScriptor medium on the full mix is the most expensive job (~7x real time) and ranked below
# ADTOF on the mix and below every separated variant. Medium stays on separated stems.
skip: ["none+muscriptor_m"]
device: auto          # auto | cpu | gpu
schemes: ["5", "3"]   # from config/classes.yaml
# Time limit per adapter call in seconds (exceeding it = "time limit" error).
# Transcribers relative to the song length: MuScriptor medium needs ~7× real time on the mix,
# ADT_STR on jazz drums ~17× (28 min for 103 s) – that should be aborted.
# Separators 30 min: RoFormer needs ~7× real time on the CPU.
timeout:
  separators: 1800
  transcribers: {factor: 10, min: 120}  # 10 × song length, at least 120 s

# Combined pipelines (stickler.combine): each class of the 5-class scheme from the pipeline
# that is best at it in the per-class F1 of the own songs (2026-11-13). The same combos are
# scored on MDB as a check on data they were not chosen on.
combos:
  quality:                       # MuScriptor for drums and toms, ADTOF for hi-hat and cymbals
    demucs+muscriptor_m: [KD, SD, TT]
    none+adtof: [HH, CY]
  toms:                          # only the toms from MuScriptor
    none+adtof: [KD, SD, HH, CY]
    demucs+muscriptor_m: [TT]
