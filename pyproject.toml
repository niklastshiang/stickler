[project]
name = "stickler"
version = "4"  # sequential: +1 with every release (ADR 0006)
license = "MIT"
license-files = ["LICENSE"]
description = "Benchmark für automatische Schlagzeug-Transkription mit Open-Source-Modellen"
readme = "README.md"
requires-python = ">=3.12,<3.15"  # CI tests 3.12 and 3.14; the adapters stay on 3.12
dependencies = [
    "mido>=1.3.3",
    "mir-eval>=0.8.2",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "typer>=0.29.1",
]

[project.scripts]
stickler = "stickler.cli:app"
stickler-gtk = "stickler_gtk.main:main"

[dependency-groups]
dev = [
    "music21>=10.5.2",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stickler", "src/stickler_gtk"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["adapters/**/weights"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not adapters and not gtk'"
markers = [
    "adapters: slow tests with real model adapters (pytest -m adapters)",
    "gtk: widget tests that need GTK and a display (scripts/gtk.sh test)",
]

[tool.coverage.run]
source = ["src/stickler", "src/stickler_gtk"]
# CLI and widgets only show what the tested code decides (CONSTRAINTS.md)
omit = ["src/stickler/cli.py", "src/stickler_gtk/main.py", "src/stickler_gtk/ui/*"]

[tool.coverage.report]
show_missing = true
