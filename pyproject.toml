[project]
name = "stickler"
version = "0"  # sequential: +1 with every release (ADR 0006)
license = "MIT"
license-files = ["LICENSE"]
description = "Benchmark für automatische Schlagzeug-Transkription mit Open-Source-Modellen"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mido>=1.3.3",
    "mir-eval>=0.8.2",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "typer>=0.29.1",
]

[project.scripts]
stickler = "stickler.cli:app"

[dependency-groups]
dev = [
    "music21>=10.5.2",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stickler"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["adapters/**/weights"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not adapters'"
markers = ["adapters: langsame Tests mit echten Modell-Adaptern (pytest -m adapters)"]

[tool.coverage.run]
source = ["src/stickler"]
omit = ["src/stickler/cli.py"]

[tool.coverage.report]
show_missing = true
