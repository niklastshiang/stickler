<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Engraved page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="width: {{width}}px; height: {{height}}px; background: {{paper}}; color: #000000; filter: {{filter}}; box-shadow: 0 1px 3px rgba(0,0,6,.18); font-family: 'Times New Roman', Times, serif;">
<svg viewBox="0 0 640 560" width="100%" height="100%" role="img" aria-label="Drum sheet music, page 1 of Eye of the Tiger">
  <defs>
    <g id="hat">
      <path d="M-3.5 -7.5l7 7M3.5 -7.5l-7 7" stroke="#000" stroke-width="1.4"></path>
    </g>
    <g id="groove">
      <g stroke="#000" stroke-width="1.1">
        <line x1="15.5" y1="-4" x2="15.5" y2="-27"></line><line x1="30" y1="-4" x2="30" y2="-27"></line>
        <line x1="44.5" y1="12" x2="44.5" y2="-27"></line><line x1="59" y1="-4" x2="59" y2="-27"></line>
        <line x1="73.5" y1="-4" x2="73.5" y2="-27"></line><line x1="88" y1="-4" x2="88" y2="-27"></line>
        <line x1="102.5" y1="12" x2="102.5" y2="-27"></line><line x1="117" y1="-4" x2="117" y2="-27"></line>
        <line x1="8.5" y1="28" x2="8.5" y2="52"></line><line x1="66.5" y1="28" x2="66.5" y2="52"></line>
        <line x1="81" y1="28" x2="81" y2="52"></line>
      </g>
      <g stroke="#000" stroke-width="3.2">
        <line x1="15" y1="-25.5" x2="30.5" y2="-25.5"></line><line x1="44" y1="-25.5" x2="59.5" y2="-25.5"></line>
        <line x1="73" y1="-25.5" x2="88.5" y2="-25.5"></line><line x1="102" y1="-25.5" x2="117.5" y2="-25.5"></line>
        <line x1="66" y1="50.5" x2="81.5" y2="50.5"></line>
      </g>
      <use href="#hat" x="12" y="0"></use><use href="#hat" x="26.5" y="0"></use><use href="#hat" x="41" y="0"></use><use href="#hat" x="55.5" y="0"></use>
      <use href="#hat" x="70" y="0"></use><use href="#hat" x="84.5" y="0"></use><use href="#hat" x="99" y="0"></use><use href="#hat" x="113.5" y="0"></use>
      <ellipse cx="41" cy="12" rx="4.2" ry="3.1" transform="rotate(-20 41 12)"></ellipse>
      <ellipse cx="99" cy="12" rx="4.2" ry="3.1" transform="rotate(-20 99 12)"></ellipse>
      <ellipse cx="12" cy="28" rx="4.2" ry="3.1" transform="rotate(-20 12 28)"></ellipse>
      <ellipse cx="70" cy="28" rx="4.2" ry="3.1" transform="rotate(-20 70 28)"></ellipse>
      <ellipse cx="84.5" cy="28" rx="4.2" ry="3.1" transform="rotate(-20 84.5 28)"></ellipse>
      <line x1="130" y1="0" x2="130" y2="32" stroke="#000" stroke-width="1"></line>
    </g>
    <g id="fill">
      <g stroke="#000" stroke-width="1.1">
        <line x1="15.5" y1="12" x2="15.5" y2="-20"></line><line x1="30" y1="12" x2="30" y2="-20"></line>
        <line x1="44.5" y1="12" x2="44.5" y2="-20"></line><line x1="59" y1="12" x2="59" y2="-20"></line>
        <line x1="73.5" y1="4" x2="73.5" y2="-20"></line><line x1="88" y1="4" x2="88" y2="-20"></line>
        <line x1="102.5" y1="20" x2="102.5" y2="-20"></line><line x1="117" y1="20" x2="117" y2="-20"></line>
      </g>
      <g stroke="#000" stroke-width="3.2">
        <line x1="15" y1="-18.5" x2="59.5" y2="-18.5"></line><line x1="15" y1="-13" x2="59.5" y2="-13"></line>
        <line x1="73" y1="-18.5" x2="117.5" y2="-18.5"></line><line x1="73" y1="-13" x2="117.5" y2="-13"></line>
      </g>
      <ellipse cx="12" cy="12" rx="4.2" ry="3.1" transform="rotate(-20 12 12)"></ellipse>
      <ellipse cx="26.5" cy="12" rx="4.2" ry="3.1" transform="rotate(-20 26.5 12)"></ellipse>
      <ellipse cx="41" cy="12" rx="4.2" ry="3.1" transform="rotate(-20 41 12)"></ellipse>
      <ellipse cx="55.5" cy="12" rx="4.2" ry="3.1" transform="rotate(-20 55.5 12)"></ellipse>
      <ellipse cx="70" cy="4" rx="4.2" ry="3.1" transform="rotate(-20 70 4)"></ellipse>
      <ellipse cx="84.5" cy="4" rx="4.2" ry="3.1" transform="rotate(-20 84.5 4)"></ellipse>
      <ellipse cx="99" cy="20" rx="4.2" ry="3.1" transform="rotate(-20 99 20)"></ellipse>
      <ellipse cx="113.5" cy="20" rx="4.2" ry="3.1" transform="rotate(-20 113.5 20)"></ellipse>
      <line x1="130" y1="0" x2="130" y2="32" stroke="#000" stroke-width="1"></line>
    </g>
    <g id="staff">
      <g stroke="#000" stroke-width="0.8">
        <line x1="0" y1="0" x2="560" y2="0"></line><line x1="0" y1="8" x2="560" y2="8"></line>
        <line x1="0" y1="16" x2="560" y2="16"></line><line x1="0" y1="24" x2="560" y2="24"></line>
        <line x1="0" y1="32" x2="560" y2="32"></line>
      </g>
      <rect x="8" y="8" width="3.5" height="16"></rect><rect x="15" y="8" width="3.5" height="16"></rect>
    </g>
  </defs>

  <text x="320" y="50" text-anchor="middle" font-size="24">Eye of the Tiger</text>
  <text x="600" y="76" text-anchor="end" font-size="13">Survivor</text>

  <rect x="{{markX}}" y="{{markY}}" width="134" height="96" rx="5" fill="#0060df" fill-opacity="0.2"></rect>

  <g transform="translate(40 128)">
    <use href="#staff"></use>
    <text x="24" y="15" font-size="17" font-weight="700">4</text><text x="24" y="31" font-size="17" font-weight="700">4</text>
    <use href="#groove" x="40"></use>
    <rect x="40" y="0" width="3" height="32"></rect><line x1="45.5" y1="0" x2="45.5" y2="32" stroke="#000"></line>
    <circle cx="50" cy="12" r="1.8"></circle><circle cx="50" cy="20" r="1.8"></circle>
    <use href="#groove" x="170"></use>
    <circle cx="293" cy="12" r="1.8"></circle><circle cx="293" cy="20" r="1.8"></circle>
    <line x1="296.5" y1="0" x2="296.5" y2="32" stroke="#000"></line><rect x="298" y="0" width="3" height="32"></rect>
    <text x="235" y="-38" font-size="13" font-style="italic">4×</text>
    <use href="#groove" x="300"></use>
    <use href="#fill" x="430"></use>
  </g>
  <g transform="translate(40 248)">
    <use href="#staff"></use>
    <text x="0" y="-14" font-size="11" font-style="italic">5</text>
    <use href="#groove" x="40"></use><use href="#groove" x="170"></use><use href="#groove" x="300"></use><use href="#groove" x="430"></use>
  </g>
  <g transform="translate(40 368)">
    <use href="#staff"></use>
    <text x="0" y="-14" font-size="11" font-style="italic">9</text>
    <use href="#groove" x="40"></use><use href="#groove" x="170"></use><use href="#groove" x="300"></use><use href="#fill" x="430"></use>
  </g>
  <g transform="translate(40 488)">
    <use href="#staff"></use>
    <text x="0" y="-14" font-size="11" font-style="italic">13</text>
    <use href="#groove" x="40"></use><use href="#groove" x="170"></use><use href="#groove" x="300"></use><use href="#groove" x="430"></use>
  </g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"width":{"editor":"int","default":640,"min":320,"max":1280},"marked":{"editor":"int","default":0,"min":0,"max":16},"inverted":{"editor":"boolean","default":false},"$preview":{"width":640,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const width = this.props.width ?? 640;
    const marked = this.props.marked ?? 0;
    const k = Math.max(marked, 1) - 1;
    const system = Math.floor(k / 4);
    const shown = marked > 0;
    const inverted = this.props.inverted === true || this.props.inverted === 'true';
    return {
      width,
      paper: inverted ? '#e4e4e6' : '#ffffff',
      filter: inverted ? 'invert(1) hue-rotate(180deg)' : 'none',
      height: Math.round(width * 560 / 640),
      markX: shown ? 40 + 40 + 130 * (k % 4) - 2 : -999,
      markY: 128 + 120 * system - 36
    };
  }
}
</script>
</body>
</html>
