<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stickler · Controls menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 1000px; height: 520px; overflow: hidden; background: #c9d4df; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; color: #1d1d1f;">
  <div style="position: absolute; left: 70px; top: 64px;">
    <dc-import name="Playing" hint-size="1000px,700px"></dc-import>
  </div>
  <nav aria-label="Menu bar" style="position: absolute; left: 0; top: 0; right: 0; height: 28px; display: flex; align-items: center; gap: 2px; padding: 0 10px; background: rgba(246,246,248,0.92); box-shadow: 0 1px 0 rgba(0,0,0,0.08); font-size: 13px;">
    <span style="padding: 3px 9px; border-radius: 5px; font-weight: 700;">Stickler</span>
    <span style="padding: 3px 9px; border-radius: 5px;">File</span>
    <span style="padding: 3px 9px; border-radius: 5px;">Edit</span>
    <span style="padding: 3px 9px; border-radius: 5px;">View</span>
    <span style="padding: 3px 9px; border-radius: 5px; background: rgba(0,0,0,0.10);">Controls</span>
    <span style="padding: 3px 9px; border-radius: 5px;">Window</span>
    <span style="padding: 3px 9px; border-radius: 5px;">Help</span>
  </nav>
  <ul role="menu" aria-label="Controls" style="position: absolute; top: 30px; left: 214px; width: 240px; list-style: none; margin: 0; padding: 5px; box-sizing: border-box; background: rgba(250,250,252,0.97); border-radius: 10px; box-shadow: 0 12px 34px rgba(0,0,0,0.22), 0 0 0 1px rgba(0,0,0,0.10); font-size: 13px;">
    <li role="menuitem" style="display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 26px; border-radius: 6px; background: #0060df; color: #ffffff;">
      <span style="flex-grow: 1;">Pause</span>
      <span style="color: rgba(255,255,255,0.85); font-size: 12px;">Space</span>
    </li>
    <li role="separator" style="height: 1px; margin: 5px 10px; background: rgba(0,0,0,0.10);"></li>
    <li role="menuitem" style="display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 26px; border-radius: 6px;">
      <span style="flex-grow: 1;">Previous Bar</span>
      <span style="color: #8e8e93; font-size: 12px;">←</span>
    </li>
    <li role="menuitem" style="display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 26px; border-radius: 6px;">
      <span style="flex-grow: 1;">Next Bar</span>
      <span style="color: #8e8e93; font-size: 12px;">→</span>
    </li>
    <li role="menuitem" style="display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 26px; border-radius: 6px;">
      <span style="flex-grow: 1;">Go to the Start</span>
      <span style="color: #8e8e93; font-size: 12px;">⌥←</span>
    </li>
    <li role="separator" style="height: 1px; margin: 5px 10px; background: rgba(0,0,0,0.10);"></li>
    <li role="menuitemradio" aria-checked="false" style="display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 26px; border-radius: 6px;">
      <span style="flex-grow: 1;">Song</span>
    </li>
    <li role="menuitemradio" aria-checked="false" style="display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 26px; border-radius: 6px;">
      <span style="flex-grow: 1;">Hits</span>
    </li>
    <li role="menuitemradio" aria-checked="true" style="position: relative; display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 26px; border-radius: 6px;">
      <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#1d1d1f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 9px; top: 7px;"><path d="M2 6.5l2.6 2.6L10 3"></path></svg>
      <span style="flex-grow: 1;">Both</span>
    </li>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":520}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
