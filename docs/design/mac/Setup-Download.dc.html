<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stickler · first start, download</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 1000px; height: 700px; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; color: #1d1d1f;">
  <dc-import name="Main" hint-size="1000px,700px"></dc-import>
  <div style="position: absolute; inset: 52px 0 0 0; background: rgba(0,0,0,0.18); border-radius: 0 0 16px 16px;"></div>
  <section role="dialog" aria-label="Downloading the Models" style="position: absolute; top: 52px; left: 240px; width: 520px; box-sizing: border-box; padding: 24px 24px 20px; background: #ffffff; border-radius: 0 0 18px 18px; box-shadow: 0 18px 50px rgba(0,0,0,0.28), 0 0 0 1px rgba(0,0,0,0.08); display: flex; flex-direction: column; gap: 14px;">
    <h2 style="margin: 0; font-size: 17px; font-weight: 700;">Downloading the Models</h2>
    <p style="margin: 0; font-size: 13px; line-height: 1.45;">If this is interrupted, Stickler picks up where it stopped the next time you open it.</p>
    <ul style="list-style: none; margin: 0; padding: 0; border-radius: 10px; background: #f5f5f7; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);">
      <li style="display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-bottom: 1px solid rgba(0,0,0,0.08);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1f7a3a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 13px; font-weight: 600;">ADTOF</span>
          <span style="font-size: 11px; color: #6e6e73;">Programs and model</span>
        </div>
        <span style="font-size: 12px; color: #6e6e73;">Done</span>
      </li>
      <li style="display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-bottom: 1px solid rgba(0,0,0,0.08);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0060df" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9" opacity="0.9"></path></svg>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 13px; font-weight: 600;">Beat This!</span>
          <div style="display: flex; align-items: center; gap: 8px;">
            <div role="progressbar" aria-label="Beat This! programs" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100" style="flex-grow: 1; height: 5px; border-radius: 3px; background: rgba(0,0,0,0.09); overflow: hidden;">
              <div style="width: 62%; height: 100%; background: #0060df;"></div>
            </div>
            <span style="font-size: 11px; color: #6e6e73;">Programs · 410 of 660 MB</span>
          </div>
        </div>
      </li>
      <li style="display: flex; gap: 12px; align-items: center; padding: 11px 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#8e8e93" aria-hidden="true"><circle cx="6" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="18" cy="12" r="1.6"></circle></svg>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 13px; font-weight: 600;">Beat This!</span>
          <span style="font-size: 11px; color: #6e6e73;">Model, 78 MB</span>
        </div>
        <span style="font-size: 12px; color: #6e6e73;">Waiting</span>
      </li>
    </ul>
    <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px;">
      <button type="button" style="height: 28px; padding: 0 16px; border: 0; border-radius: 999px; background: rgba(0,0,0,0.07); color: #1d1d1f; font: 500 13px -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif;">Cancel</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":700}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
