<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stickler · analysing a song</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1000px; height: 700px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #1d1d1f; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; border-radius: 16px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.18);">
  <header style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 14px 0 18px; background: #f6f6f6; border-bottom: 1px solid rgba(0,0,0,0.10);">
    <div style="display: flex; gap: 8px;" aria-hidden="true">
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #ff5f57;"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #febc2e;"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #28c840;"></span>
    </div>
    <div style="margin-left: 6px; flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
      <h1 style="margin: 0; font-size: 15px; font-weight: 600; line-height: 1.2;">Eye of the Tiger</h1>
      <p style="margin: 0; font-size: 11px; line-height: 1.2; color: #6e6e73;">Survivor</p>
    </div>
    <div style="display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(0,0,0,0.04); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.10);">
      <button type="button" aria-label="Open a Song" style="width: 36px; height: 30px; border: 0; border-radius: 999px; background: transparent; color: #1d1d1f; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      </button>
      <button type="button" aria-label="Export" disabled style="width: 36px; height: 30px; border: 0; border-radius: 999px; background: transparent; color: #a8a8ad; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"></path></svg>
      </button>
    </div>
  </header>
  <main style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 32px;">
    <h2 style="margin: 0; font-size: 22px; font-weight: 700;">Writing the Drum Part</h2>
    <p style="margin: -10px 0 0; font-size: 13px; color: #6e6e73;">Takes about 15 seconds</p>
    <ul style="list-style: none; margin: 4px 0 0; padding: 0; width: 460px; border-radius: 10px; background: #f9f9fb; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.10);">
      <li style="display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-bottom: 1px solid rgba(0,0,0,0.08);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1f7a3a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 13px; font-weight: 600;">Detect the hits</span>
          <span style="font-size: 11px; color: #6e6e73;">Kick, snare, toms, hi-hat, cymbals</span>
        </div>
        <span style="font-size: 12px; color: #6e6e73;">Done</span>
      </li>
      <li style="display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-bottom: 1px solid rgba(0,0,0,0.08);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0060df" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"></path></svg>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 13px; font-weight: 600;">Find the beat and the bars</span>
          <span style="font-size: 11px; color: #6e6e73;">Tempo, time signature, the first “one”</span>
        </div>
        <span style="font-size: 12px; color: #6e6e73;">Running</span>
      </li>
      <li style="display: flex; gap: 12px; align-items: center; padding: 11px 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#8e8e93" aria-hidden="true"><circle cx="6" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="18" cy="12" r="1.6"></circle></svg>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 13px; font-weight: 600;">Write the notes</span>
          <span style="font-size: 11px; color: #6e6e73;">Bars, repeats, beams</span>
        </div>
        <span style="font-size: 12px; color: #6e6e73;">Waiting</span>
      </li>
    </ul>
    <button type="button" style="height: 28px; padding: 0 16px; border: 0; border-radius: 999px; background: rgba(0,0,0,0.07); color: #1d1d1f; font: 500 13px -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif;">Cancel</button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":700}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
