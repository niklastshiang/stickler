<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stickler · playing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 1000px; height: 700px; box-sizing: border-box; display: flex; flex-direction: column; background: {{c.window}}; color: {{c.text}}; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; border-radius: 16px; overflow: hidden; box-shadow: inset 0 0 0 1px {{c.edge}};">
  <header style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 14px 0 18px; background: {{c.bar}}; border-bottom: 1px solid {{c.hair}};">
    <div style="display: flex; gap: 8px;" aria-hidden="true">
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #ff5f57;"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #febc2e;"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #28c840;"></span>
    </div>
    <div style="margin-left: 6px; flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0;">
      <h1 style="margin: 0; font-size: 15px; font-weight: 600; line-height: 1.2;">Eye of the Tiger</h1>
      <p style="margin: 0; font-size: 11px; line-height: 1.2; color: {{c.secondary}};">Survivor · ♩ = 109 · 4/4</p>
    </div>
    <div style="display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: {{c.capsule}}; box-shadow: inset 0 0 0 1px {{c.hair}};">
      <button type="button" aria-label="Open a Song" style="width: 36px; height: 30px; border: 0; border-radius: 999px; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      </button>
      <button type="button" aria-label="Export" style="height: 30px; padding: 0 8px 0 9px; border: 0; border-radius: 999px; background: transparent; color: {{c.text}}; display: flex; align-items: center; gap: 3px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"></path></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>
  </header>
  <main style="flex-grow: 1; min-height: 0; display: flex; justify-content: center; align-items: flex-start; padding: 44px 0 0; background: {{c.desk}}; overflow: hidden;">
    <dc-import name="SheetPage" width="640" marked="2" inverted="{{dark}}" hint-size="640px,560px"></dc-import>
  </main>
  <div role="toolbar" aria-label="Controls" style="position: absolute; left: 50px; bottom: 16px; width: 900px; height: 52px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 26px; background: {{c.glass}}; backdrop-filter: blur(20px); box-shadow: 0 8px 26px rgba(0,0,0,0.16), 0 0 0 1px {{c.glassEdge}}; font-size: 13px;">
    <div style="display: flex; align-items: center; gap: 2px; flex-shrink: 0;">
      <button type="button" aria-label="Previous Bar" title="Previous Bar" style="width: 32px; height: 32px; border: 0; border-radius: 16px; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="2.5" y="3" width="1.8" height="10" rx="0.9"></rect><path d="M13 3.6v8.8a.6.6 0 0 1-.92.5L5.6 8.5a.6.6 0 0 1 0-1l6.48-4.4a.6.6 0 0 1 .92.5z"></path></svg>
      </button>
      <button type="button" aria-label="Pause" title="Pause" style="width: 36px; height: 36px; border: 0; border-radius: 18px; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="3.5" y="2.5" width="3" height="11" rx="1"></rect><rect x="9.5" y="2.5" width="3" height="11" rx="1"></rect></svg>
      </button>
      <button type="button" aria-label="Next Bar" title="Next Bar" style="width: 32px; height: 32px; border: 0; border-radius: 16px; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="11.7" y="3" width="1.8" height="10" rx="0.9"></rect><path d="M3 3.6v8.8a.6.6 0 0 0 .92.5l6.48-4.4a.6.6 0 0 0 0-1L3.92 3.1a.6.6 0 0 0-.92.5z"></path></svg>
      </button>
    </div>
    <span style="width: 34px; flex-shrink: 0; text-align: right; font-size: 11px; font-variant-numeric: tabular-nums; color: {{c.secondary}};">0:06</span>
    <div role="slider" tabindex="0" aria-label="Position" aria-valuemin="0" aria-valuemax="246" aria-valuenow="6" aria-valuetext="0:06, Bar 2 of 110" style="flex-grow: 1; min-width: 120px; height: 24px; position: relative; display: flex; align-items: center;">
      <div style="width: 100%; height: 4px; border-radius: 2px; background: {{c.track}};"></div>
      <div style="position: absolute; left: 0; width: 2.4%; height: 4px; border-radius: 2px; background: {{c.accent}};"></div>
      <div style="position: absolute; left: calc(2.4% - 11px); width: 22px; height: 16px; border-radius: 8px; background: #ffffff; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.12), 0 1px 3px rgba(0,0,0,0.25);"></div>
    </div>
    <span style="width: 34px; flex-shrink: 0; font-size: 11px; font-variant-numeric: tabular-nums; color: {{c.secondary}};">4:06</span>
    <span style="width: 92px; flex-shrink: 0; white-space: nowrap;">Bar 2 of 110</span>
    <button type="button" aria-label="Volume" title="Volume" aria-haspopup="dialog" aria-expanded="{{volumeExpanded}}" style="width: 32px; height: 32px; flex-shrink: 0; border: 0; border-radius: 16px; background: {{volumeBg}}; color: {{c.text}}; display: flex; align-items: center; justify-content: center;">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6h2.5l3.5-3v10l-3.5-3H2.5z" fill="currentColor"></path><path d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.5a6 6 0 0 1 0 9"></path></svg>
    </button>
    <div role="radiogroup" aria-label="What to Hear" style="width: 168px; height: 28px; box-sizing: border-box; flex-shrink: 0; display: flex; gap: 2px; padding: 2px; border-radius: 14px; background: {{c.segTrack}};">
      <sc-for list="{{hearOptions}}" as="opt" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{opt.checked}}" style="{{opt.style}}">{{opt.label}}</button>
      </sc-for>
    </div>
  </div>
  <sc-if value="{{volumeOpen}}" hint-placeholder-val="{{false}}">
    <div role="dialog" aria-label="Volume" style="position: absolute; left: 600px; bottom: 80px; width: 296px; box-sizing: border-box; display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 12px; row-gap: 10px; padding: 14px 16px; border-radius: 14px; background: {{c.popover}}; backdrop-filter: blur(20px); box-shadow: 0 10px 30px rgba(0,0,0,0.20), 0 0 0 1px {{c.glassEdge}}; font-size: 13px; color: {{c.text}};">
      <span>Song</span>
      <div role="slider" tabindex="0" aria-label="Song" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70" style="height: 20px; position: relative; display: flex; align-items: center;">
        <div style="width: 100%; height: 4px; border-radius: 2px; background: {{c.track}};"></div>
        <div style="position: absolute; left: 0; width: 70%; height: 4px; border-radius: 2px; background: {{c.accent}};"></div>
        <div style="position: absolute; left: calc(70% - 11px); width: 22px; height: 16px; border-radius: 8px; background: #ffffff; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.12), 0 1px 3px rgba(0,0,0,0.25);"></div>
      </div>
      <span>Detected hits</span>
      <div role="slider" tabindex="0" aria-label="Detected hits" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" style="height: 20px; position: relative; display: flex; align-items: center;">
        <div style="width: 100%; height: 4px; border-radius: 2px; background: {{c.accent}};"></div>
        <div style="position: absolute; left: calc(100% - 22px); width: 22px; height: 16px; border-radius: 8px; background: #ffffff; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.12), 0 1px 3px rgba(0,0,0,0.25);"></div>
      </div>
      <svg width="20" height="10" viewBox="0 0 20 10" aria-hidden="true" style="position: absolute; left: 138px; bottom: -9px;"><path d="M0 0h20L10 10z" fill="{{c.popoverSolid}}"></path></svg>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"volume":{"editor":"boolean","default":false},"hear":{"editor":"enum","options":["Song","Hits","Both"],"default":"Both"},"$preview":{"width":1000,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark === true || this.props.dark === 'true';
    const volumeOpen = this.props.volume === true || this.props.volume === 'true';
    const hear = this.props.hear ?? 'Both';
    const light = {window: '#ffffff', bar: '#f6f6f6', hair: 'rgba(0,0,0,0.10)', edge: 'rgba(0,0,0,0.18)', text: '#1d1d1f', secondary: '#6e6e73', capsule: 'rgba(0,0,0,0.04)', desk: '#ececee', glass: 'rgba(250,250,252,0.86)', glassEdge: 'rgba(0,0,0,0.10)', popover: 'rgba(250,250,252,0.97)', popoverSolid: '#fafafc', track: 'rgba(0,0,0,0.12)', accent: '#0060df', segTrack: 'rgba(0,0,0,0.07)', segOn: '#ffffff', hover: 'rgba(0,0,0,0.07)'};
    const darkC = {window: '#1e1e1e', bar: '#2a2a2b', hair: 'rgba(255,255,255,0.10)', edge: 'rgba(255,255,255,0.16)', text: '#f5f5f7', secondary: '#a1a1a6', capsule: 'rgba(255,255,255,0.06)', desk: '#141414', glass: 'rgba(44,44,46,0.86)', glassEdge: 'rgba(255,255,255,0.12)', popover: 'rgba(44,44,46,0.97)', popoverSolid: '#2c2c2e', track: 'rgba(255,255,255,0.18)', accent: '#0a84ff', segTrack: 'rgba(255,255,255,0.08)', segOn: 'rgba(255,255,255,0.24)', hover: 'rgba(255,255,255,0.10)'};
    const c = dark ? darkC : light;
    const hearOptions = ['Song', 'Hits', 'Both'].map((label) => {
      const on = label === hear;
      const style = 'flex: 1; height: 24px; border: 0; border-radius: 12px; color: ' + c.text + '; font: ' + (on ? '500' : '400') + ' 13px -apple-system, \'SF Pro Text\', Inter, system-ui, sans-serif; background: ' + (on ? c.segOn : 'transparent') + '; box-shadow: ' + (on ? '0 1px 2px rgba(0,0,0,0.18), 0 0 0 0.5px rgba(0,0,0,0.06)' : 'none') + ';';
      return { label, checked: on ? 'true' : 'false', style };
    });
    return {
      dark, c, volumeOpen, hearOptions,
      volumeExpanded: volumeOpen ? 'true' : 'false',
      volumeBg: volumeOpen ? c.hover : 'transparent'
    };
  }
}
</script>
</body>
</html>
