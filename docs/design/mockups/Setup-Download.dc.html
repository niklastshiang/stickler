<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stickler: first start, download</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1c71d8}a:hover{color:#1a5fb4}
.light{--win:#fafafb;--card:#ffffff;--fg:rgba(0,0,6,.8);--dim:rgba(0,0,6,.56);--line:rgba(0,0,6,.1);--btn:rgba(0,0,6,.07);--accent:#3584e4;--accent-fg:#1c71d8;--ok:#1b8553;--trough:rgba(0,0,6,.12);--shadow:0 0 0 1px rgba(0,0,6,.03),0 1px 3px 1px rgba(0,0,6,.07),0 2px 6px 2px rgba(0,0,6,.03)}
.dark{--win:#222226;--card:rgba(255,255,255,.08);--fg:#ffffff;--dim:rgba(255,255,255,.62);--line:rgba(255,255,255,.1);--btn:rgba(255,255,255,.1);--accent:#3584e4;--accent-fg:#78aeed;--ok:#8ff0a4;--trough:rgba(255,255,255,.18);--shadow:0 0 0 1px rgba(0,0,6,.09),0 1px 3px 1px rgba(0,0,6,.09)}
</style>
</helmet>
<div class="{{theme}}" style="width: 1000px; height: 700px; display: flex; flex-direction: column; background: var(--win); color: var(--fg); font-family: Inter, 'Adwaita Sans', Cantarell, sans-serif; font-size: 15px; overflow: hidden;">
  <header style="height: 47px; flex-shrink: 0; display: flex; align-items: center; padding: 0 6px;">
    <div style="flex-grow: 1;"></div>
    <button aria-label="Close" style="width: 34px; height: 34px; border: 0; background: transparent; color: var(--fg); display: flex; align-items: center; justify-content: center;">
      <span style="width: 24px; height: 24px; border-radius: 12px; background: var(--btn); display: flex; align-items: center; justify-content: center;">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6"></path></svg>
      </span>
    </button>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding-bottom: 47px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;">
      <h1 style="margin: 0; font-size: 26px; font-weight: 800;">Downloading the Models</h1>
      <p style="margin: 0; max-width: 460px; color: var(--dim); line-height: 1.45;">If this is interrupted, Stickler picks up where it stopped the next time you open it.</p>
    </div>

    <div role="progressbar" aria-label="Setup" aria-valuemin="0" aria-valuemax="3" aria-valuenow="1" aria-valuetext="Step 2 of 3" style="width: 460px; height: 6px; border-radius: 3px; background: var(--trough); overflow: hidden;">
      <div style="width: 33%; height: 6px; border-radius: 3px; background: var(--accent);"></div>
    </div>

    <ol aria-label="Steps" style="width: 460px; margin: 0; padding: 0; list-style: none; background: var(--card); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;">
      <li style="display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 8px 16px; box-sizing: border-box; border-bottom: 1px solid var(--line);">
        <span style="width: 24px; height: 24px; border-radius: 12px; background: var(--ok); color: #ffffff; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5l2.5 2.5L11 4.5"></path></svg>
        </span>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span>ADTOF</span>
          <span style="font-size: 13px; color: var(--dim);">Programs and model</span>
        </div>
        <span style="font-size: 13px; color: var(--dim);">Done</span>
      </li>
      <li style="display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 8px 16px; box-sizing: border-box; border-bottom: 1px solid var(--line);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" style="flex-shrink: 0;" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="var(--line)"></circle><path d="M12 3a9 9 0 0 1 9 9" stroke="var(--accent)"></path></svg>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-weight: 700;">Beat This!</span>
          <span style="font-size: 13px; color: var(--dim);">Programs</span>
        </div>
        <span style="font-size: 13px; color: var(--accent-fg); font-weight: 700;">Downloading</span>
      </li>
      <li style="display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 8px 16px; box-sizing: border-box;">
        <span style="width: 20px; height: 20px; margin: 2px; border-radius: 10px; border: 2px solid var(--line); box-sizing: border-box; flex-shrink: 0;"></span>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="color: var(--dim);">Beat This!</span>
          <span style="font-size: 13px; color: var(--dim);">Model, 78 MB</span>
        </div>
        <span style="font-size: 13px; color: var(--dim);">Waiting</span>
      </li>
    </ol>

    <button style="height: 38px; padding: 0 28px; border: 0; border-radius: 19px; background: var(--btn); color: var(--fg); font: inherit; font-weight: 700;">Cancel</button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1000,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
