<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stickler for Windows · export saved</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 1000px; height: 700px; font-family: 'Segoe UI Variable Text', 'Segoe UI', Inter, system-ui, sans-serif; color: #1b1b1b;">
  <dc-import name="Sheet" hint-size="1000px,700px"></dc-import>
  <div role="status" style="position: absolute; top: 124px; right: 24px; width: 320px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 16px; background: #f9f9f9; border-radius: 8px; box-shadow: 0 0 0 1px rgba(0,0,0,0.10), 0 8px 16px rgba(0,0,0,0.14); font-size: 14px; line-height: 20px; color: #1b1b1b;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="flex-shrink: 0;"><circle cx="8" cy="8" r="8" fill="#0f7b0f"></circle><path d="M4.6 8.2l2.4 2.4 4.4-4.8" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="flex-grow: 1;">Saved “Eye of the Tiger.pdf”</span>
    </div>
    <div style="display: flex; justify-content: flex-end;">
      <button type="button" style="height: 32px; box-sizing: border-box; padding: 0 12px; border: 1px solid rgba(0,0,0,0.16); border-radius: 4px; background: #ffffff; color: #1b1b1b; font: 400 14px 'Segoe UI Variable Text', 'Segoe UI', Inter, system-ui, sans-serif;">Show in Folder</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":700}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
