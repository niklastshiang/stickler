[project]
name = "stickler-yourmt3"
version = "0.1.0"
description = "Stickler adapter: YourMT3+ YPTF.MoE+Multi (Chang et al. 2024), inference code from the HF Space"
requires-python = ">=3.12,<3.13"
# Dependencies following the Space's requirements.txt (revision: see common.py), without
# Gradio and yt-dlp, which only the web interface needs.
dependencies = [
    "stickler-adapter",
    "huggingface_hub",
    "torch==2.8.0",
    "torchaudio==2.8.0",  # before torchcodec; run.py loads audio with soundfile anyway
    "pytorch-lightning>=2.2.1",
    "transformers==4.45.1",
    "numpy==1.26.4",
    "einops",
    "deprecated",
    "mido",
    "mir_eval",
    "librosa",
    "soundfile>=0.12",
    "wandb",  # imported by model/ymt3.py; logging stays off
]

[tool.uv]
package = false

[tool.uv.sources]
stickler-adapter = { path = "../../_common", editable = true }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
