[project]
name = "stickler-yourmt3"
version = "0.1.0"
description = "Stickler-Adapter: YourMT3+ YPTF.MoE+Multi (Chang et al. 2024), Inferenz-Code aus dem HF-Space"
requires-python = ">=3.12,<3.13"
# Abhängigkeiten nach requirements.txt des Space (Revision siehe common.py); ohne Gradio,
# yt-dlp, die nur die Web-Oberfläche brauchen.
dependencies = [
    "stickler-adapter",
    "huggingface_hub",
    "torch==2.8.0",
    "torchaudio==2.8.0",  # vor torchcodec; Audio lädt run.py ohnehin per soundfile
    "pytorch-lightning>=2.2.1",
    "transformers==4.45.1",
    "numpy==1.26.4",
    "einops",
    "deprecated",
    "mido",
    "mir_eval",
    "librosa",
    "soundfile>=0.12",
    "wandb",  # wird in model/ymt3.py beim Import geladen, Logging bleibt aus
]

[tool.uv]
package = false

[tool.uv.sources]
stickler-adapter = { path = "../../_common", editable = true }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
