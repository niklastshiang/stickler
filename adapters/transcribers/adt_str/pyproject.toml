[project]
name = "stickler-adt-str"
version = "0.1.0"
description = "Stickler-Adapter für ADT_STR (Melucci, Merialdo, Akama 2026)"
requires-python = ">=3.12,<3.13"
# Versionen wie im offiziellen pyproject.toml von pier-maker92/ADT_STR (v1.0.0),
# reduziert auf die Imports des Inferenz-Pfads.
dependencies = [
    "stickler-adapter",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchcodec>=0.7,<0.8",
    "transformers[torch]",
    "safetensors",
    "omegaconf",
    "pretty_midi",
    "numpy",
    "huggingface-hub",
    "h5py",
    "pedalboard",
    "pyyaml",
    "soundfile>=0.12.1",
]

[tool.uv]
package = false

[tool.uv.sources]
stickler-adapter = { path = "../../_common", editable = true }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
