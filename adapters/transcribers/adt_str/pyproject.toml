[project]
name = "stickler-adt-str"
version = "0.1.0"
description = "Stickler adapter for ADT_STR (Melucci, Merialdo, Akama 2026)"
requires-python = ">=3.12,<3.13"
# Versions as in the official pyproject.toml of pier-maker92/ADT_STR (v1.0.0), reduced to the
# imports of the inference path. No torchcodec: soundfile loads the audio.
dependencies = [
    "stickler-adapter",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers[torch]",
    "safetensors",
    "omegaconf",
    "pretty_midi",
    "numpy",
    "huggingface-hub",
    "h5py",
    "pedalboard",
    "pyyaml",
    "soundfile>=0.12.1",
]

[tool.uv]
package = false

[tool.uv.sources]
stickler-adapter = { path = "../../_common", editable = true }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Trained only on (synthetic) isolated drums: on the mix the decoder hallucinates and runs up
# to max_length (>10 min for 36 s). Hence never without a separator.
[tool.stickler]
input = "stem"

# GPU-Variante (stickler setup --adapter adt_str --device rocm), see docs/adr/0003-rocm-kanal.md
[tool.stickler.rocm]
index = "https://repo.amd.com/rocm/whl-multi-arch/"
replace = ["torch", "torchaudio"]
# Measured (MDB Rock/Punk, drum stem): the GPU gives identical notes but takes 1.5–1.7× longer
prefer_gpu = false
packages = [
    "torch[device-gfx1152]==2.12.0+rocm7.14.1",
    "torchaudio==2.11.0+rocm7.14.1",
]
