[project]
name = "stickler-adt-str"
version = "0.1.0"
description = "Stickler-Adapter für ADT_STR (Melucci, Merialdo, Akama 2026)"
requires-python = ">=3.12,<3.13"
# Versionen wie im offiziellen pyproject.toml von pier-maker92/ADT_STR (v1.0.0),
# reduziert auf die Imports des Inferenz-Pfads. torchcodec entfällt: Audio lädt soundfile.
dependencies = [
    "stickler-adapter",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers[torch]",
    "safetensors",
    "omegaconf",
    "pretty_midi",
    "numpy",
    "huggingface-hub",
    "h5py",
    "pedalboard",
    "pyyaml",
    "soundfile>=0.12.1",
]

[tool.uv]
package = false

[tool.uv.sources]
stickler-adapter = { path = "../../_common", editable = true }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Trainiert nur auf (synthetischem) reinem Schlagzeug: auf dem Mix halluziniert der Decoder
# und läuft bis max_length (>10 min für 36 s). Daher nie ohne Separator.
[tool.stickler]
input = "stem"

# GPU-Variante (stickler setup --adapter adt_str --device rocm), siehe docs/adr/0003-rocm-kanal.md
[tool.stickler.rocm]
index = "https://repo.amd.com/rocm/whl-multi-arch/"
replace = ["torch", "torchaudio"]
# Gemessen (MDB Rock/Punk, Drum-Stem): GPU liefert identische Noten, braucht aber 1,5–1,7× länger
prefer_gpu = false
packages = [
    "torch[device-gfx1152]==2.12.0+rocm7.14.1",
    "torchaudio==2.11.0+rocm7.14.1",
]
