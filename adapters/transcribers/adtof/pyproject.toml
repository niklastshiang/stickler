[project]
name = "stickler-adtof"
version = "0.1.0"
description = "Stickler adapter: ADTOF Frame_RNN (Zehren et al. 2023), PyTorch port by xavriley"
requires-python = ">=3.12,<3.13"
dependencies = [
    "stickler-adapter",
    "adtof-pytorch",
    "torch>=2.1",
    "pretty_midi",
    "numpy",  # imported directly (activations.npz)
]

[tool.uv]
package = false

[tool.uv.sources]
stickler-adapter = { path = "../../_common", editable = true }
# Not on PyPI; pinned to the state of 2025-11-11 (weights included in the package)
adtof-pytorch = { git = "https://github.com/xavriley/ADTOF-pytorch", rev = "85c192e78f716ea0b111cc8a5ee4a8f6a3a4f8a9" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# No GPU variant: ~1 s per song on the CPU (MDB Punk, 29 s); a ROCm environment (~5 GB) is not
# worth it (ADR 0003: fp32 is not faster on the Radeon 840M anyway).
