[project]
name = "stickler-demucs"
version = "0.1.0"
description = "Stickler adapter: drum stem with Demucs v4 (maintained fork adefossez/demucs)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "stickler-adapter",
    "demucs==4.1.0",  # PyPI release of the fork github.com/adefossez/demucs (ADR 0001)
    "torch>=2.1",
    "soundfile>=0.12.1",
]

[tool.uv]
package = false
# Stickler only runs on Linux; demucs pins torch<2.3 for Intel macOS, which held the whole lock
# at torch 2.2.2 (critical CVE GHSA-53q9-r3pm-6pq6, found by Dependabot on 2026-11-13).
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
stickler-adapter = { path = "../../_common", editable = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# GPU-Variante (stickler setup --adapter demucs --device rocm), see docs/adr/0003-rocm-kanal.md
[tool.stickler.rocm]
index = "https://repo.amd.com/rocm/whl-multi-arch/"
replace = ["torch"]
packages = ["torch[device-gfx1152]==2.12.0+rocm7.14.1"]
# Measured (MDB Punk, 29 s mix): GPU 120 s, CPU 68 s, same notes afterwards → prefer the CPU
prefer_gpu = false
