# Pairs of code digests whose cached results are the same: `from` an earlier digest `to` a
# later one. stickler.runner.cache_dir_for renames an entry under `from` to the current key on
# first use, but only along a chain of pairs that ends at the adapter's current digest: after a
# real behaviour change the chain stops there, and nothing earlier is handed to the new code.
#
# Add a pair only for an edit that does not change what the adapter computes (comments,
# translations, a new definition of the digest), never after a real behaviour change. Take
# `from` with `stickler cache-digests` before the edit and `to` after it; keep earlier pairs
# (a cache may still hold their entries).
