# Pairs of code digests whose cached results are the same: `from` an earlier digest `to` a
# later one. stickler.runner.cache_dir_for renames an entry under `from` to the current key on
# first use, but only along a chain of pairs that ends at the adapter's current digest: after a
# real behaviour change the chain stops there, and nothing earlier is handed to the new code.
#
# Add a pair only for an edit that does not change what the adapter computes (comments,
# translations, a new definition of the digest), never after a real behaviour change. Take
# `from` with `stickler cache-digests` before the edit and `to` after it; keep earlier pairs
# (a cache may still hold their entries).
equivalent:
  # 2026-11-16 (Task 87): the digest now covers the modules run.py and setup.py import,
  # uv.lock, .python-version and adapters/_common (before: run.py, pyproject.toml, setup.py).
  # These adapters are unchanged since release 6 (muscriptor_l was added after it and is
  # unchanged since). Not listed: drumsep_onset, whose onsets.py changed behaviour under the
  # same old digest (its earlier results exist only in a test container).
  # Second pair, 2026-11-16: adapters/_common gained stickler_adapter.onsets, which these
  # adapters do not import (a new module changes the digest, not their behaviour).
  # 2026-11-17 (Task 96): stickler_adapter reads ru_maxrss as bytes on macOS (KiB elsewhere);
  # on Linux the same number, so every adapter's results stay valid. drumsep_onset and sad
  # get their first pair here.
  # 2026-11-17 (Task 97): demucs, muscriptor_m and muscriptor_l resolve for macOS arm64 too;
  # scripts/lock_platforms.py shows Linux unchanged (0 differences) and 
  # would change nothing in their Linux environments.
  # 2026-11-24 (Task 169): stickler_adapter imports `resource` only where it exists and reads
  # the peak working set on Windows; on Linux and macOS the same code runs as before, so
  # every adapter's results stay valid.
  # 2026-11-24 (Task 170): demucs, muscriptor_m and muscriptor_l resolve for Windows x64 too;
  # scripts/lock_platforms.py shows Linux unchanged (0 differences), and the locks only gained
  # entries (colorama and win_amd64 wheels), so macOS keeps its packages as well.
  # 2026-11-25 (Task 189): stickler_adapter.allow_proxy_certificates, which only Beat This!'s
  # setup.py calls before its download (Python's strict certificate mode left out behind a
  # company proxy); what every adapter computes is unchanged.
