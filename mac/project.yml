# The Mac app's Xcode project, generated by XcodeGen 2.46.0 in CI (SPEC.md, module `mac-shell`,
# scope 3): no one here has Xcode, so the project is written as this file and generated where
# it is built. `xcodegen generate --spec mac/project.yml` writes mac/Stickler.xcodeproj.
name: Stickler
options:
  bundleIdPrefix: ng.tshia
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  SticklerCore:
    path: SticklerCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    # the project's version (pyproject.toml; ADR 0006: releases are numbered 1, 2, 3 …); both
    # move at a release, tests/test_mac_icon.py keeps them equal
    MARKETING_VERSION: "7"
    CURRENT_PROJECT_VERSION: "7"
    CODE_SIGN_IDENTITY: "-" # ad-hoc, no Apple Developer Program (SPEC.md "Release 8")
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: NO # the catalog comes from po/ (scripts/xcstrings.py), not from code
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Stickler:
    type: application
    platform: macOS
    sources:
      - path: Stickler
      # the music font for the PDF's text (the tempo mark), with its licence (SIL OFL 1.1)
      - path: ../packaging/fonts/Leipzig.ttf
        buildPhase: resources
      - path: ../packaging/fonts/OFL.txt
        buildPhase: resources
    dependencies:
      - package: SticklerCore
    settings:
      base:
        PRODUCT_NAME: Stickler
        PRODUCT_BUNDLE_IDENTIFIER: ng.tshia.Stickler
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Stickler
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon # scripts/mac_icon.py draws it
        ENABLE_HARDENED_RUNTIME: NO # it runs its own uv and the models' Pythons under ~/Library
  SticklerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SticklerTests
    dependencies:
      - target: Stickler
      - package: SticklerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ng.tshia.SticklerTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Stickler.app/Contents/MacOS/Stickler"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Stickler:
    build:
      targets:
        Stickler: all
        SticklerTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - SticklerTests
